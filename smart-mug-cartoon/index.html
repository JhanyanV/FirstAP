<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Perfect Sip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #17110d;
    --panel: #241b15;
    --ink: #f6ece0;
    --muted: #b4a492;
    --accent: #ffb454;
    --line: #3a2d24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 28px 16px 40px;
  }
  main { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1 {
    font-family: Fredoka, Nunito, system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(34px, 6vw, 52px);
    line-height: 1.05;
    margin: 0;
    color: var(--accent);
    text-wrap: balance;
  }
  .sub { margin: 8px 0 0; color: var(--muted); max-width: 62ch; line-height: 1.5; }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage {
    flex: 0 0 auto;
    width: min(100%, calc(min(80vh, 760px) * 9 / 16));
    aspect-ratio: 9 / 16;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #000;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .side { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: 700 15px Nunito, system-ui, sans-serif;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: #241505; border-color: var(--accent); }
  .seek { display: flex; align-items: center; gap: 12px; }
  .seek input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .chapters { display: grid; gap: 6px; }
  .chapters button {
    display: flex; gap: 12px; align-items: baseline; text-align: left;
    border-radius: 10px; padding: 9px 14px; font-weight: 400; color: var(--muted);
  }
  .chapters button b { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.2ch; }
  .chapters button.on { color: var(--ink); border-color: var(--accent); }
  .dl { margin: 0; color: var(--muted); font-size: 14px; }
  .dl a { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <header>
    <h1>The Perfect Sip</h1>
    <p class="sub">A 27-second cartoon remake of a vertical smart-mug ad: the slow-motion pour, the hidden display, a long workday, a golden-hour swipe and the charging coaster. Turn sound on for the lo-fi beat.</p>
  </header>

  <div class="layout">
    <div class="stage">
      <canvas id="scene" width="540" height="960" role="img" aria-label="Cartoon ad: coffee is poured into a matte black smart mug; a woman in a knit sweater smells it; a tap wakes a glowing 135°F display; three hours later at her desk it is still hot; at sunset a thumb swipe sets it to 145°F; the mug docks on a glowing charging coaster."></canvas>
    </div>
    <div class="side">
      <div class="controls">
        <button id="play" type="button" aria-label="Play">▶ Play</button>
        <button id="replay" type="button">↺ Replay</button>
        <button id="sound" type="button" aria-pressed="false">🔈 Sound off</button>
      </div>
      <div class="seek">
        <input id="seek" type="range" min="0" max="26.6" step="0.01" value="0" aria-label="Seek">
        <span id="clock">0:00 / 0:26</span>
      </div>
      <nav class="chapters" id="chapters" aria-label="Scenes"></nav>
      <p class="dl"><a href="smart-mug-cartoon.mp4" download>Download the MP4</a> · 1080×1920, 30 fps</p>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const W = 540, H = 960, TAU = Math.PI * 2;
  const BEAT = 0.7, BAR = 2.8;
  const params = new URLSearchParams(location.search);
  const EXPORT = params.has('export');
  const SCALE = EXPORT ? 2 : Math.min(window.devicePixelRatio || 1, 2);

  // ---------- Math helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const io = x => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const eo = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const back = x => { x = clamp(x, 0, 1); return 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2); };
  const bump = (t, a, d) => { const u = (t - a) / d; return u <= 0 || u >= 1 ? 0 : Math.sin(u * Math.PI); };
  const rand = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  function mulberry(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // shadowBlur and filter lengths ignore the transform, so scale them by hand
  const glow = (c, color, b) => { c.shadowColor = color; c.shadowBlur = b * SCALE; };
  const blur = px => (px > 0 ? `blur(${(px * SCALE).toFixed(2)}px)` : 'none');

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const grainCanvas = (() => {
    const g = document.createElement('canvas');
    g.width = g.height = 128;
    const gc = g.getContext('2d'), img = gc.createImageData(128, 128), R = mulberry(5);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 70 + R() * 185;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    gc.putImageData(img, 0, 0);
    return g;
  })();
  const patterns = new WeakMap();
  const grain = c => {
    let p = patterns.get(c);
    if (!p) { p = c.createPattern(grainCanvas, 'repeat'); patterns.set(c, p); }
    return p;
  };

  // Static backgrounds are painted once into offscreen canvases
  const caches = {};
  function cached(key, w, h, paint) {
    if (!caches[key]) {
      const cc = document.createElement('canvas');
      cc.width = Math.round(w * SCALE); cc.height = Math.round(h * SCALE);
      const x = cc.getContext('2d');
      x.setTransform(SCALE, 0, 0, SCALE, 0, 0);
      paint(x);
      caches[key] = cc;
    }
    return caches[key];
  }

  function bez(p0, p1, p2, p3, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, v = 1 - u;
      pts.push([
        v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
        v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1],
      ]);
    }
    return pts;
  }
  // Polygon around a polyline with a width that varies along it
  function tube(c, pts, wf) {
    const L = [], R = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      const w = wf(i / (pts.length - 1)) / 2;
      L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]);
      R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
    }
    c.beginPath();
    c.moveTo(L[0][0], L[0][1]);
    for (const p of L) c.lineTo(p[0], p[1]);
    for (let i = R.length - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
    c.closePath();
    return { L, R };
  }

  // ---------- Palette ----------
  const SK = '#c8916a', SK_L = '#dba680', SK_D = '#a9734f', SK_E = '#8a5a3c';
  const NAIL = '#c7716f';
  const HAIR = '#3a2219', HAIR_L = '#5d3b2a';
  const KN = '#e8d6bc', KN_L = '#f4e9d8', KN_D = '#d5bf9f', KN_E = '#bca382';
  const ACCENT = '#ffb454';

  // ---------- Seven-segment LED text ----------
  const SEGMAP = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', F: 'aefg' };
  function hseg(c, x1, x2, y, th) {
    const h = th / 2;
    c.moveTo(x1, y); c.lineTo(x1 + h, y - h); c.lineTo(x2 - h, y - h);
    c.lineTo(x2, y); c.lineTo(x2 - h, y + h); c.lineTo(x1 + h, y + h); c.closePath();
  }
  function vseg(c, x, y1, y2, th) {
    const h = th / 2;
    c.moveTo(x, y1); c.lineTo(x + h, y1 + h); c.lineTo(x + h, y2 - h);
    c.lineTo(x, y2); c.lineTo(x - h, y2 - h); c.lineTo(x - h, y1 + h); c.closePath();
  }
  function digitPath(c, ch, x, y, w, h, th) {
    const s = SEGMAP[ch] || '', g = th * 0.2, m = y + h / 2;
    if (s.includes('a')) hseg(c, x + g, x + w - g, y, th);
    if (s.includes('g')) hseg(c, x + g, x + w - g, m, th);
    if (s.includes('d')) hseg(c, x + g, x + w - g, y + h, th);
    if (s.includes('f')) vseg(c, x, y + g, m - g, th);
    if (s.includes('b')) vseg(c, x + w, y + g, m - g, th);
    if (s.includes('e')) vseg(c, x, m + g, y + h - g, th);
    if (s.includes('c')) vseg(c, x + w, m + g, y + h - g, th);
  }
  function ledText(c, str, cx, cy, h, a, color = '#f3f8ff') {
    if (a <= 0.003) return;
    const w = h * 0.5, th = h * 0.15, gap = h * 0.25, degW = h * 0.32;
    let total = 0;
    for (const ch of str) total += ch === '°' ? degW : w + gap;
    total -= gap;
    c.save();
    c.globalAlpha *= clamp(a, 0, 1);
    c.translate(cx, cy);
    c.transform(1, 0, -0.1, 1, 0, 0);
    const y = -h / 2;
    let x = -total / 2;
    c.beginPath();
    for (const ch of str) {
      if (ch === '°') { x += degW; continue; }
      digitPath(c, ch, x, y, w, h, th);
      x += w + gap;
    }
    glow(c, 'rgba(185,215,255,0.95)', h * 0.45);
    c.fillStyle = color;
    c.fill(); c.fill();
    x = -total / 2;
    for (const ch of str) {
      if (ch === '°') {
        c.beginPath(); c.arc(x + degW * 0.38, y + h * 0.1, h * 0.085, 0, TAU);
        c.lineWidth = th * 0.7; c.strokeStyle = color; c.stroke();
        x += degW;
      } else x += w + gap;
    }
    c.restore();
  }

  // ---------- The mug ----------
  function mugBodyPath(c, x, y, w, h, ry) {
    const rx = w / 2, top = y - h;
    c.beginPath();
    c.moveTo(x - rx, top);
    c.lineTo(x - rx, y);
    c.ellipse(x, y, rx, ry, 0, Math.PI, 0, true);
    c.lineTo(x + rx, top);
    c.ellipse(x, top, rx, ry, 0, 0, Math.PI, false);
    c.closePath();
  }
  function drawHandle(c, x, top, w, h, side) {
    const hx = x + side * w * 0.46;
    c.save();
    c.lineCap = 'round';
    c.strokeStyle = '#121214'; c.lineWidth = w * 0.13;
    c.beginPath(); c.moveTo(hx, top + h * 0.22);
    c.bezierCurveTo(hx + side * w * 0.4, top + h * 0.14, hx + side * w * 0.42, top + h * 0.78, hx, top + h * 0.72);
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = w * 0.03;
    c.beginPath(); c.moveTo(hx + side * w * 0.05, top + h * 0.22);
    c.bezierCurveTo(hx + side * w * 0.38, top + h * 0.18, hx + side * w * 0.4, top + h * 0.72, hx + side * w * 0.05, top + h * 0.69);
    c.stroke();
    c.restore();
  }
  function drawCoffee(c, m, x, cy, rx, ry) {
    const g = c.createRadialGradient(x - rx * 0.1, cy - ry * 0.2, 0, x, cy, rx);
    g.addColorStop(0, '#6e4121'); g.addColorStop(0.55, '#4b2a14'); g.addColorStop(1, '#26150a');
    c.beginPath(); c.ellipse(x, cy, rx, ry, 0, 0, TAU);
    c.fillStyle = g; c.fill();
    const sw = m.swirl || 0;
    c.lineCap = 'round';
    for (let k = 0; k < 4; k++) {
      const f = 0.26 + k * 0.17, a0 = sw * (1.5 - k * 0.22) + k * 1.7;
      c.strokeStyle = `rgba(200,146,92,${0.42 - k * 0.07})`;
      c.lineWidth = Math.max(1, rx * 0.05);
      c.beginPath(); c.ellipse(x, cy, rx * f, ry * f, 0, a0, a0 + 1.9); c.stroke();
    }
    const n = Math.round((m.bubbles ?? 0.6) * 28);
    for (let i = 0; i < n; i++) {
      const r0 = 0.2 + rand(i * 3.1) * 0.72, a = rand(i * 7.7) * TAU + sw * (1.6 - r0);
      const bx = x + Math.cos(a) * rx * r0, by = cy + Math.sin(a) * ry * r0;
      const br = rx * (0.012 + rand(i * 1.3) * 0.024);
      c.fillStyle = 'rgba(232,196,150,0.75)';
      c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.65)';
      c.beginPath(); c.arc(bx - br * 0.3, by - br * 0.3, br * 0.35, 0, TAU); c.fill();
    }
    c.fillStyle = 'rgba(255,232,205,0.10)';
    c.beginPath(); c.ellipse(x + (m.light ?? 1) * rx * 0.35, cy - ry * 0.3, rx * 0.26, ry * 0.2, 0, 0, TAU); c.fill();
  }
  // m: {x, y (bottom centre), w, h, ry, handle, coffee, swirl, bubbles, display, temp, light (+1 key from right), rim, rimColor, sweep}
  function drawMug(c, m) {
    const x = m.x, y = m.y, w = m.w, h = m.h, rx = w / 2, ry = m.ry ?? rx * 0.28, top = y - h;
    const L = m.light ?? 1;
    if (m.handle) drawHandle(c, x, top, w, h, m.handle);
    mugBodyPath(c, x, y, w, h, ry);
    const g = c.createLinearGradient(x - rx, 0, x + rx, 0);
    const stops = [[0, '#0a0a0b'], [0.28, '#161618'], [0.66, '#2b2b30'], [0.84, '#202024'], [1, '#0b0b0c']];
    for (const [o, col] of stops) g.addColorStop(L > 0 ? o : 1 - o, col);
    c.fillStyle = g; c.fill();
    c.save();
    c.clip();
    c.globalAlpha = 0.07; c.fillStyle = grain(c); c.fillRect(x - rx, top - ry, w, h + ry * 2);
    c.globalAlpha = 1;
    const v = c.createLinearGradient(0, top, 0, y + ry);
    v.addColorStop(0, 'rgba(255,255,255,0.03)'); v.addColorStop(1, 'rgba(0,0,0,0.32)');
    c.fillStyle = v; c.fillRect(x - rx, top - ry, w, h + ry * 2);
    if (m.rim) {
      const ex = x + L * rx, bw = w * 0.14;
      const rg = c.createLinearGradient(ex - L * bw, 0, ex, 0);
      rg.addColorStop(0, 'rgba(255,255,255,0)');
      rg.addColorStop(1, m.rimColor || `rgba(255,232,205,${m.rim})`);
      c.fillStyle = rg; c.fillRect(Math.min(ex, ex - L * bw), top - ry, bw, h + ry * 2);
    }
    if (m.sweep !== undefined && m.sweep > -1 && m.sweep < 2) {
      const sx = x - rx + m.sweep * w;
      const sg = c.createLinearGradient(sx - w * 0.16, 0, sx + w * 0.16, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.16)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = sg; c.fillRect(x - rx, top - ry, w, h + ry * 2);
    }
    c.restore();
    // rim and opening
    c.beginPath(); c.ellipse(x, top, rx, ry, 0, 0, TAU);
    c.fillStyle = '#202024'; c.fill();
    const wall = w * 0.05, irx = rx - wall, iry = Math.max(1, ry - wall * (ry / rx));
    c.save();
    c.beginPath(); c.ellipse(x, top + wall * 0.08, irx, iry, 0, 0, TAU); c.clip();
    const ig = c.createLinearGradient(0, top - iry, 0, top + iry);
    ig.addColorStop(0, '#1d1d21'); ig.addColorStop(1, '#050506');
    c.fillStyle = ig; c.fillRect(x - rx, top - ry, w, ry * 2);
    if (m.coffee > 0) drawCoffee(c, m, x, top + (1 - m.coffee) * iry * 2, irx, iry);
    c.restore();
    c.lineWidth = Math.max(1, w * 0.008);
    c.strokeStyle = 'rgba(255,255,255,0.16)';
    c.beginPath();
    if (L > 0) c.ellipse(x, top, rx - 0.5, ry - 0.5, 0, Math.PI * 1.55, Math.PI * 2.1);
    else c.ellipse(x, top, rx - 0.5, ry - 0.5, 0, Math.PI * 0.9, Math.PI * 1.45);
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.06)';
    c.beginPath(); c.ellipse(x, top, rx - 0.5, ry - 0.5, 0, 0.1, Math.PI - 0.1); c.stroke();
    if (m.display) ledText(c, m.temp || '135°F', x, y - h * 0.2, h * (m.digit || 0.13), m.display);
  }
  // Clip region where a pour stream or droplets are visible: above the rim or inside the opening
  function clipAboveMug(c, x, top, w, ry) {
    const rx = w / 2, wall = w * 0.05;
    c.beginPath();
    c.rect(-50, -50, W + 100, top + 50);
    c.ellipse(x, top, rx - wall, Math.max(1, ry - wall * (ry / rx)), 0, 0, TAU);
    c.clip();
  }

  function drawCoaster(c, x, y, rx, ry, glowK, flick = 1) {
    const th = ry * 0.6;
    if (glowK > 0) {
      c.save();
      c.translate(x, y + th); c.scale(1, ry * 2.6 / (rx * 1.7));
      const fg = c.createRadialGradient(0, 0, rx * 0.5, 0, 0, rx * 1.7);
      fg.addColorStop(0, `rgba(170,214,255,${0.7 * glowK * flick})`);
      fg.addColorStop(0.45, `rgba(190,224,255,${0.3 * glowK * flick})`);
      fg.addColorStop(1, 'rgba(200,230,255,0)');
      c.fillStyle = fg;
      c.beginPath(); c.arc(0, 0, rx * 1.7, 0, TAU); c.fill();
      c.restore();
    }
    c.beginPath();
    c.ellipse(x, y + th, rx, ry, 0, 0, Math.PI);
    c.lineTo(x - rx, y);
    c.ellipse(x, y, rx, ry, 0, Math.PI, 0, true);
    c.closePath();
    c.fillStyle = '#121214'; c.fill();
    c.save();
    c.lineWidth = Math.max(1.5, ry * 0.18);
    c.strokeStyle = glowK > 0 ? `rgba(245,250,255,${0.25 + 0.75 * glowK * flick})` : '#3a3a40';
    if (glowK > 0) glow(c, 'rgba(150,205,255,1)', ry * 0.9 * glowK);
    c.beginPath(); c.ellipse(x, y + th * 0.82, rx * 0.985, ry, 0, 0.05, Math.PI - 0.05); c.stroke();
    c.restore();
    const tg = c.createLinearGradient(x - rx, 0, x + rx, 0);
    tg.addColorStop(0, '#18181b'); tg.addColorStop(0.6, '#2a2a2f'); tg.addColorStop(1, '#141416');
    c.fillStyle = tg;
    c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(x, y, rx * 0.78, ry * 0.78, 0, 0, TAU); c.stroke();
  }

  function steam(c, x, y, w, t, amt, o = {}) {
    if (amt <= 0.01) return;
    if (o.shade) steam(c, x + 1.5, y + 1.5, w, t, amt, { ...o, shade: null, col: o.shade, a: (o.a || 0.28) * 0.45, lw: (o.lw || 0.085) * 1.5 });

    for (let t = S4 + 0.3; t < S4 + 2.9;) {
      const fast = t > S4 + 1.8;
      noise(t, 0.018, { type: 'bandpass', f0: (fast ? 4200 : 3200) + R() * 800, q: 2, v: 0.05 + R() * 0.05 });
      t += fast ? 0.035 + R() * 0.025 : 0.08 + R() * 0.08 + (R() < 0.12 ? 0.25 : 0);
    }
    for (let i = 0; i < 26; i++) { const u = i / 26; osc(S4 + 1.8 + (1 - Math.pow(1 - u, 1.6)) * 1.05, 0.03, { type: 'square', f0: 2200, v: 0.022 }); }
    noise(S4 + 1.75, 1.15, { type: 'bandpass', f0: 300, f1: 2400, q: 2, v: 0.12, shape: 'whoosh' });
    noise(S4 + 2.95, 0.3, { type: 'bandpass', f0: 800, f1: 1600, q: 1, v: 0.06, shape: 'whoosh' });
    noise(S4 + 3.85, 0.55, { type: 'bandpass', f0: 900, f1: 1800, q: 4, v: 0.12, shape: 'whoosh' });
    bell(S4 + 4.55, 84, 0.9); bell(S4 + 4.67, 88, 0.9);
    // S5 swipe: whoosh + a tick per degree + confirm
    noise(S5 + 0.95, 0.5, { type: 'bandpass', f0: 700, f1: 4200, q: 1.2, v: 0.14, shape: 'whoosh' });
    for (let k = 1; k <= 10; k++) {
      let lo = 0, hi = 1;
      for (let n = 0; n < 30; n++) { const mid = (lo + hi) / 2; if (io(mid) * 10 < k - 0.5) lo = mid; else hi = mid; }
      osc(S5 + 1.0 + lo * 0.7, 0.03, { f0: 1200 + k * 120, v: 0.07 });
    }
    bell(S5 + 1.72, 91, 1, 1.0); bell(S5 + 1.79, 96, 0.7, 1.0);
    osc(S5 + 2.2, 0.08, { f0: 500, f1: 900, glide: 0.06, v: 0.12 });
    for (let k = 0; k < 6; k++) noise(S5 + 2.6 + k * 0.05, 0.05, { type: 'bandpass', f0: 2200 + R() * 800, q: 2, v: 0.1 });
    osc(S5 + 3.0, 0.09, { f0: 650, f1: 1200, glide: 0.07, v: 0.13 });
    // S6 dock: click + tock, ring light power-on
    noise(S6 + 0.95, 0.02, { type: 'highpass', f0: 2500, v: 0.25 });
    osc(S6 + 0.95, 0.08, { f0: 320, f1: 170, v: 0.3 });
    [84, 88, 91, 96].forEach((m, i) => bell(S6 + 1.02 + i * 0.06, m, 0.55, 0.9));
    noise(S6 + 1.02, 0.7, { type: 'highpass', f0: 7000, v: 0.05, shape: 'whoosh' });
    // end card call-to-action
    bell(END + 0.85, 91, 0.9, 1.2); bell(END + 0.92, 96, 0.6, 1.2);
  }

  // ---------- Audio render + export plumbing ----------
  const SR = 44100;
  let audioBuf = null;
  const audioReady = (async () => {
    const oc = new OfflineAudioContext(2, Math.ceil(SR * DURATION), SR);
    score(oc, oc.destination);
    audioBuf = await oc.startRendering();
  })().catch(e => console.warn('audio render failed', e));

  function wavBase64(buf) {
    const n = buf.length, ch = buf.numberOfChannels, sr = buf.sampleRate;
    const ab = new ArrayBuffer(44 + n * ch * 2), v = new DataView(ab);
    const s = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    s(0, 'RIFF'); v.setUint32(4, 36 + n * ch * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
    s(36, 'data'); v.setUint32(40, n * ch * 2, true);
    const data = [];
    for (let c = 0; c < ch; c++) data.push(buf.getChannelData(c));
    let o = 44;
    for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
      const x = clamp(data[c][i], -1, 1);
      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
    }
    let bin = '';
    const u8 = new Uint8Array(ab);
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  const fontsReady = (document.fonts && document.fonts.load
    ? Promise.all([document.fonts.load(CAP_FONT), document.fonts.load('700 62px Fredoka'), document.fonts.load('500 27px Fredoka')]).catch(() => {})
    : Promise.resolve()
  ).then(() => [bgPour, bgRoom, bgMarble, bgDesk, fgDesk, bgSunset, bgTiles, bgEnd].forEach(f => f()));

  if (EXPORT) {
    window.cartoon = {
      duration: DURATION,
      ready: Promise.all([fontsReady, audioReady]),
      renderAt(t) { render(t); return cv.toDataURL('image/png'); },
      async renderAudio() { await audioReady; return wavBase64(audioBuf); },
    };
    return;
  }

  // ---------- Live playback + controls ----------
  const playBtn = document.getElementById('play');
  const soundBtn = document.getElementById('sound');
  const seek = document.getElementById('seek');
  const clockEl = document.getElementById('clock');
  const chapters = document.getElementById('chapters');
  seek.max = DURATION.toFixed(2);
  const fmt = x => { x = Math.max(0, Math.floor(x)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };

  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.i = i;
    b.innerHTML = `<b>${fmt(s.at)}</b><span>${s.label}</span>`;
    b.addEventListener('click', () => { seekTo(s.at + 0.001); if (!playing) play(); });
    chapters.appendChild(b);
  });
  const chapterBtns = [...chapters.children];

  let t = 0, playing = false, soundOn = false, base = 0, baseT = 0;
  let actx = null, src = null;
  const now = () => (soundOn && actx ? actx.currentTime : performance.now() / 1000);

  function stopSrc() {
    if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
  }
  async function startSrc() {
    stopSrc();
    if (!soundOn || !playing) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    await audioReady;
    if (!audioBuf || !playing || !soundOn) return;
    stopSrc();
    src = actx.createBufferSource();
    src.buffer = audioBuf;
    src.connect(actx.destination);
    base = actx.currentTime; baseT = t;
    src.start(0, Math.min(t, DURATION - 0.01));
  }
  function play() {
    if (t >= DURATION - 0.05) t = 0;
    playing = true;
    base = now(); baseT = t;
    playBtn.textContent = '❚❚ Pause';
    playBtn.setAttribute('aria-label', 'Pause');
    startSrc();
  }
  function pause() {
    playing = false;
    stopSrc();
    playBtn.textContent = '▶ Play';
    playBtn.setAttribute('aria-label', 'Play');
  }
  function seekTo(x) {
    t = clamp(x, 0, DURATION);
    base = now(); baseT = t;
    if (playing) startSrc();
    render(t); ui();
  }
  function ui() {
    seek.value = t.toFixed(2);
    clockEl.textContent = fmt(t) + ' / ' + fmt(DURATION);
    const cur = sceneAt(t);
    chapterBtns.forEach((b, k) => b.classList.toggle('on', k === cur));
  }
  function frame() {
    if (playing) {
      t = baseT + (now() - base);
      if (t >= DURATION) { t = DURATION; pause(); }
      render(t); ui();
    }
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener('click', () => (playing ? pause() : play()));
  document.getElementById('replay').addEventListener('click', () => { seekTo(0); if (!playing) play(); });
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? '🔊 Sound on' : '🔈 Sound off';
    base = now(); baseT = t;
    if (soundOn) { if (playing) startSrc(); else play(); } else stopSrc();
  });
  seek.addEventListener('input', () => seekTo(+seek.value));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/^(BUTTON|INPUT|A)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      playing ? pause() : play();
    }
  });

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  fontsReady.then(() => {
    render(reduce ? S3 + 1.8 : 0); ui();
    if (reduce) render(S3 + 1.8); else play();
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>

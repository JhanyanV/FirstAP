<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAF 2026 Opening Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap">
<style>
  /* Layout: one 1920×1080 stage scaled into a dark presenter's viewer; slides keep the AMMA deck's navy and gold, the exploration charts keep the research doc's white style */
  :root {
    color-scheme: dark;
    --viewer: #0A1322;
    --chrome: #121F35;
    --chrome-line: #273856;
    --chrome-ink: #E8EDF4;
    --chrome-muted: #9EACC0;
    --navy: #10284C;
    --gold: #D6A63A;
    --gold-ink: #8E6A1E;
    --cream: #F4F1EA;
    --panel: #FBFAF6;
    --rule: #D8DDE3;
    --ink: #172332;
    --slate: #4A5F80;
    --source: #5B6878;
    --mist: #C5D0DE;
    --steel: #8FA0B8;
    --rust: #B0582C;
    --chip: #D9E1EC;
    --paper: #FFFFFF;
    --r-ink: #0B0B0B;
    --r-sub: #52514E;
    --r-bar: #C3C2B7;
    --r-bar-2: #DEDED7;
    --r-grid: #E6E5DE;
    --blue: #2A78D6;
    --blue-soft: #69A0E2;
    --blue-fill: #94BBEA;
    --blue-ink: #1F64B8;
    --serif: 'Noto Serif', Georgia, 'Times New Roman', serif;
    --sans: 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  html { height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body { height: 100%; margin: 0; overflow: hidden; background: var(--viewer); color: var(--chrome-ink); font: 15px/1.45 var(--sans); }
  p, h1, h2, h3 { margin: 0; }
  [hidden] { display: none !important; }

  /* ---------- viewer ---------- */
  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 16px 12px; position: relative; }
  .screen { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; border-radius: 6px; background: var(--viewer); cursor: pointer; outline: none; }
  .screen:fullscreen { background: #000; border-radius: 0; }
  .screen.idle { cursor: none; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--navy); }
  .stage.instant .slide { transition: none !important; }
  .blackout { position: absolute; inset: 0; background: #000; z-index: 20; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: 600 14px/1 var(--sans); color: var(--chrome-ink); background: var(--chrome);
    border: 1px solid var(--chrome-line); border-radius: 8px; padding: 0 14px; min-height: 40px; cursor: pointer;
  }
  .btn:hover { border-color: var(--gold); }
  .btn:focus-visible, .menu button:focus-visible, .screen:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn[aria-pressed="true"] { background: var(--gold); color: #1B1405; border-color: var(--gold); }
  .btn.count { font-variant-numeric: tabular-nums; min-width: 84px; }
  .where { flex: 1 1 240px; min-width: 0; color: var(--chrome-muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .notes { flex: 0 0 auto; max-height: 34%; overflow: auto; background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 8px; padding: 14px 18px; display: grid; gap: 8px; }
  .notes-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
  .cue { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
  .meta { font-size: 13px; color: var(--chrome-muted); font-variant-numeric: tabular-nums; }
  .say { font-size: 18px; line-height: 1.55; max-width: 72ch; color: var(--chrome-ink); }
  .track { height: 4px; background: var(--chrome-line); border-radius: 2px; overflow: hidden; }
  .track span { display: block; height: 100%; width: 0; background: var(--gold); }

  .menu { position: absolute; left: 16px; bottom: 64px; z-index: 30; width: min(440px, calc(100% - 32px)); max-height: 70%; overflow: auto; background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 10px; padding: 8px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
  .menu h3 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--chrome-muted); padding: 10px 10px 4px; }
  .menu button { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; color: var(--chrome-ink); font: 14px/1.35 var(--sans); cursor: pointer; }
  .menu button:hover, .menu button[aria-current="true"] { background: var(--chrome-line); }
  .menu button b { min-width: 2ch; color: var(--gold); font-variant-numeric: tabular-nums; }
  .keys { font-size: 12px; line-height: 1.6; color: var(--chrome-muted); padding: 10px; border-top: 1px solid var(--chrome-line); margin-top: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- slides (1920×1080 canvas) ---------- */
  .slide { position: absolute; inset: 0; overflow: hidden; font-family: var(--sans); visibility: hidden; opacity: 0; transition: opacity .5s ease, visibility 0s linear .5s; }
  .slide.on { visibility: visible; opacity: 1; transition: opacity .5s ease, visibility 0s; }
  .light { background: var(--cream); color: var(--ink); }
  .navy { background: var(--navy); color: var(--cream); }
  .white { background: var(--paper); color: var(--r-ink); }
  .frame { position: absolute; left: 128px; right: 128px; top: 128px; bottom: 160px; display: flex; flex-direction: column; gap: 48px; }
  .white .frame { top: 96px; bottom: 112px; gap: 24px; }
  .head { display: flex; flex-direction: column; gap: 12px; }
  .white .head { gap: 8px; }
  .eyebrow { font-size: 24px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; line-height: 1.3; color: var(--gold-ink); }
  .navy .eyebrow { color: var(--gold); }
  .h2 { font-family: var(--serif); font-size: 56px; font-weight: 600; line-height: 1.12; color: var(--navy); text-wrap: balance; }
  .navy .h2 { color: var(--cream); }
  .white .h2 { font-family: var(--sans); font-size: 48px; font-weight: 700; line-height: 1.2; color: var(--r-ink); }
  .lede { font-size: 28px; line-height: 1.3; color: var(--r-sub); }
  .src { position: absolute; left: 128px; bottom: 64px; width: 1664px; font-size: 24px; line-height: 1.3; color: var(--source); }
  .white .src { bottom: 44px; color: var(--r-sub); }
  .navy .src { color: var(--steel); }
  .row { display: flex; gap: 64px; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .big { font-family: var(--serif); font-size: 80px; font-weight: 600; line-height: 1.05; color: var(--navy); font-variant-numeric: lining-nums tabular-nums; }
  .t28 { font-size: 28px; line-height: 1.35; }
  .t24 { font-size: 24px; line-height: 1.3; }
  .cap { font-size: 24px; color: var(--slate); }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 0; }
  .spacer { flex: 1; }

  /* vertical bar charts */
  .vc { display: flex; flex-direction: column; gap: 12px; }
  .vc-track { position: relative; display: flex; align-items: flex-end; gap: var(--gap, 14px); border-bottom: 2px solid var(--navy); }
  .vc-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vc-val { font-size: 24px; font-weight: 600; color: var(--slate); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vc-val.strong { font-weight: 700; color: var(--navy); }
  .vc-bar { align-self: stretch; }
  .vc-cats { display: flex; gap: var(--gap, 14px); }
  .vc-cats p { flex: 1; min-width: 0; font-size: 24px; line-height: 1.2; text-align: center; color: var(--ink); }
  .vc-cats p.strong { font-weight: 700; color: var(--navy); }
  .white .vc-track { border-bottom-color: var(--r-bar); }
  .white .vc-val { color: var(--r-ink); font-weight: 500; }
  .white .vc-val.strong { color: var(--r-ink); font-weight: 700; }
  .white .vc-cats p { color: var(--r-sub); }
  .navy .vc-track { border-bottom-color: var(--steel); }
  .navy .vc-val { color: var(--cream); font-size: 28px; font-weight: 700; }
  .navy .vc-cats p { color: var(--mist); }

  /* horizontal benchmark rows (research style) */
  .hr-rows { position: relative; display: flex; flex-direction: column; }
  .hr-row { display: flex; align-items: center; gap: 14px; }
  .hr-name { width: 420px; flex: 0 0 420px; display: flex; flex-direction: column; }
  .hr-name p { font-size: 24px; line-height: 1.15; color: var(--r-ink); }
  .hr-name p + p { color: var(--r-sub); }
  .hr-bar { height: 36px; background: var(--r-bar); flex: 0 0 auto; }
  .hr-val { font-size: 26px; font-weight: 500; color: var(--r-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hr-row.arm .hr-name p:first-child, .hr-row.arm .hr-val { font-weight: 700; }
  .hr-row.arm .hr-bar { background: var(--blue); }

  /* cover and close */
  .pit { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16, 40, 76, .98) 0%, rgba(16, 40, 76, .9) 42%, rgba(16, 40, 76, .25) 100%); }
  .mark { display: flex; align-items: baseline; gap: 20px; }
  .mark b { font-size: 30px; font-weight: 700; letter-spacing: 6px; color: var(--cream); }
  .mark span { font-size: 22px; letter-spacing: 1px; color: var(--mist); }
  .display { font-family: var(--serif); font-size: 112px; font-weight: 600; line-height: 1.08; letter-spacing: -1px; color: var(--cream); }
  .display .ln { display: block; }
  .goldrule { width: 240px; height: 6px; background: var(--gold); transform-origin: 0 50%; }
  .mist { color: var(--mist); }

  /* timeline */
  .tl { position: relative; display: flex; }
  .tl-line { position: absolute; left: 14px; right: 0; top: 47px; height: 4px; background: var(--gold); transform-origin: 0 50%; }
  .tl-item { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding-right: 40px; }
  .tl-date { font-size: 24px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-ink); }
  .tl-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 6px var(--cream); }
  .band { display: flex; align-items: center; gap: 40px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 32px 40px; }
  .band .eyebrow { white-space: nowrap; }
  .city { display: inline-block; }

  /* exports rows */
  .xrow { height: 120px; display: flex; align-items: center; }
  .xrow .lab { width: 340px; padding-right: 24px; font-size: 28px; line-height: 1.3; color: var(--ink); }
  .xrow .neg { width: 56px; height: 120px; display: flex; align-items: center; justify-content: flex-end; }
  .xrow .axis { width: 2px; height: 120px; background: var(--navy); }
  .xrow .pos { flex: 1; display: flex; align-items: center; gap: 12px; }
  .xbar { height: 64px; }
  .xval { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* misc blocks */
  .engine { display: flex; align-items: center; gap: 20px; }
  .engine i { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; background: var(--navy); color: var(--cream); display: grid; place-items: center; font: 600 28px/1 var(--serif); font-style: normal; }
  .stampline { font-family: var(--serif); font-size: 44px; font-weight: 600; line-height: 1.15; color: var(--navy); transform-origin: 0 50%; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .chip { font-size: 24px; font-weight: 600; text-align: center; color: var(--navy); background: var(--chip); padding: 10px 16px; border-radius: 999px; }
  .tf { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 40px 36px; }
  .tf-n { font-family: var(--serif); font-size: 56px; font-weight: 600; line-height: 1.1; color: var(--gold-ink); }
  .tf-t { font-size: 28px; font-weight: 700; line-height: 1.35; color: var(--navy); }
  .tfi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 20px; position: relative; }
  .tfi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--navy); transform: scaleX(var(--k, 1)); transform-origin: 0 50%; }
  .pot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .pot h3 { font-size: 28px; font-weight: 600; color: var(--cream); }
  .stat { display: flex; flex-direction: column; gap: 8px; }
</style>

<div class="app" id="app">
  <div class="screen" id="screen" tabindex="0" role="region" aria-roledescription="slide deck" aria-label="MAF 2026 opening presentation. Use the arrow keys or click to move between slides.">
    <div class="stage" id="stage"></div>
  </div>
  <section class="notes" id="notes" hidden aria-label="Speaker notes">
    <div class="notes-top"><p class="cue" id="cue"></p><p class="meta" id="meta"></p></div>
    <p class="say" id="say"></p>
    <div class="track" id="track" hidden><span id="trackFill"></span></div>
  </section>
  <nav class="bar" aria-label="Presentation controls">
    <div class="group">
      <button class="btn" id="prev" type="button" aria-label="Previous slide">←</button>
      <button class="btn" id="next" type="button" aria-label="Next slide">→</button>
      <button class="btn count" id="jump" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span id="count">1 / 17</span></button>
    </div>
    <p class="where" id="where"></p>
    <div class="group">
      <button class="btn" id="rehearse" type="button" aria-pressed="false">Rehearse</button>
      <button class="btn" id="notesBtn" type="button" aria-pressed="false">Notes</button>
      <button class="btn" id="full" type="button">Full screen</button>
    </div>
  </nav>
  <div class="menu" id="menu" hidden role="dialog" aria-label="Go to slide"></div>
  <p class="sr" id="live" aria-live="polite"></p>
</div>

<script>
(() => {
  'use strict';
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const EASE = {
    out: x => 1 - Math.pow(1 - x, 3),
    inout: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
    back: x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2),
    lin: x => x,
  };

  // ---------------------------------------------------------------------------
  // Speech: the final English address from the MAF 2026 project, split by slide
  // ---------------------------------------------------------------------------
  const SAY = {
    cover: '[Honourable Deputy Prime Minister,] distinguished Members of the National Assembly, Ministers, Excellencies, dear colleagues and guests, Welcome to Tsaghkadzor, and to the third Mining Armenia Forum.',
    year: "A year ago, at this Forum, the Prime Minister named two priorities for our sector: a new phase in the study of Armenia's subsoil, and bringing our industry up to the best international environmental standards. Let me report what our Association has done since. In May we joined the International Council on Mining and Metals. One year ago today we delivered to the Government a legal memorandum on implementing CRIRSCO, the reporting standard investors trust; this spring a Government working group began its work. In July we signed a memorandum with the Ministry of Territorial Administration and Infrastructure. Together with the Government we represented Armenia in London, Toronto, Riyadh, Lima and Brussels, and we held the first Mining Innovation Summit.",
    copper: 'This year copper traded at the highest prices in its history, close to fifteen thousand dollars a tonne. The International Energy Agency warns that by 2035 mines will supply a quarter less copper than the world needs. Grids, electric vehicles, data centres for artificial intelligence: all are built on copper and the metals beside it, molybdenum among them. And because supply chains sit in very few countries, minerals have become a matter of economic security. The world is not short of copper in the ground. It is short of places where it can be mined responsibly and reliably. Armenia can be one of those places. We have seventy years of production at Kajaran, more than ten thousand skilled people, and a place on the Tethyan copper and gold belt. And this year brought a critical minerals framework with the United States, European buyers looking for new suppliers, and a region moving towards peace and open routes.',
    gdp: "Mining's weight in our economy is rising fast. In the second quarter the economy grew by almost seven percent; mining grew three times faster. Its share of GDP has risen from about three percent in 2024 and 2025 to almost five percent this year.",
    exports: 'In the first seven months, mining exports grew by three quarters, while exports of Armenian-made goods rose by a third. Exports of two billion dollars are within reach, and next year, by our estimate, mining will make up more than 54 percent of Armenian-made exports.',
    ore: 'But let us be honest about where this growth comes from. It has two engines: record metal prices, and Amulsar, finally in production eight years late. Not a single new deposit. For a decade our mines have moved roughly the same thirty million tonnes of ore a year.',
    trend: 'The reason is simple: Armenia barely explores.',
    armenia: 'Over the past ten years, our official statistics record about eight million dollars of exploration for metals: less than one million a year, and falling.',
    explore: 'Per square kilometre, Kazakhstan spends more than twice as much as we do; Canada and Australia, more than ten times as much.',
    licences: 'Ten years ago, forty-four exploration permits for metals were in force. Today there are two, and both re-assess old deposits. Last year Kazakhstan granted seven hundred exploration licences; Armenia granted one. In thirty-five years of independence, we have made one major discovery.',
    potential: "This is not a reproach. It is the size of the opportunity. Armenia is not yet using its potential. The rise we see today in mining's share of GDP, in exports and in taxes could be far larger. By our estimate, if we explored the way other mining countries do, all three could double, bringing the state budget up to one billion dollars a year. That means roads, schools and security, skilled jobs in Syunik, Lori and Vayots Dzor, and a reason for young people to build their future at home.",
    standards: "Potential becomes value only when it is explored, reported in a language investors trust, and mined to a standard society trusts. CRIRSCO tells the world what is in the ground. A sustainability standard shows how we mine: tailings, water, biodiversity, climate, safety, communities. Measured mine by mine. Verified independently. Published. Our Association has set its course: national adoption of such a standard, modelled on Canada's Towards Sustainable Mining and the new Consolidated Mining Standard, in line with the Government's Mining Strategy to 2035. On Monday the world comes to Yerevan for COP17 on biodiversity. To those who ask how we mine, our answer today is a commitment. It must become a verified result.",
    taskforces: "Standards are half of the task. Rules are the other half. Geology we cannot change; policy we can. What we need now, together, is pace. So I propose that Government and industry, building on our existing working groups, create four reform task forces, each with one mandate, one accountable lead and one deadline. One for geology and exploration. One for the Subsoil Code and permitting. One for responsible mining standards, with civil society. One for investment, infrastructure and value added at home. The Prime Minister's initiative, the Center for Natural Resources and Sustainable Growth, can give them evidence, and these two days their first agenda. Next October, let us report results here, not intentions.",
    close: 'Dear colleagues, our theme is "From Resources to Opportunities". Resources are a gift of nature. Opportunities are built: with knowledge, with standards, with trust. I thank our sponsors and partners, our guests from abroad, and the team behind this Forum. I wish us all two productive days. Thank you.',
  };
  const CUE = {
    cover: 'On screen during the welcome',
    canada: 'Backup slide · show only if asked',
    australia: 'Backup slide · show only if asked',
    permits: 'Backup slide · show only if asked about mining permits',
  };

  // ---------------------------------------------------------------------------
  // Chart builders
  // ---------------------------------------------------------------------------
  const decOf = s => ((String(s).split('.')[1] || '').replace(/[^0-9]/g, '')).length;
  const num = s => parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  // A counting label: final text is restored exactly at the end of its animation
  const counter = (text, cls = '', extra = '') =>
    `<p class="${cls}" data-final="${text}" data-to="${num(text)}" data-dec="${decOf(text)}" ${extra}>${text}</p>`;

  function vchart(o) {
    const cols = o.vals.map((v, i) => {
      const hl = (o.hl || []).includes(i);
      const h = v > 0 ? Math.max(2, Math.round(v / o.max * o.barMax)) : 0;
      const lab = o.labels ? o.labels[i] : String(v);
      const color = o.colorAt ? o.colorAt(i) : hl ? o.hlColor : o.color;
      const extra = o.barStyle ? o.barStyle(i) : '';
      const label = o.noCount ? `<p class="vc-val${hl ? ' strong' : ''}">${lab}</p>` : counter(lab, 'vc-val' + (hl ? ' strong' : ''), o.pre ? `data-pre="${o.pre(i)}"` : '');
      return `<div class="vc-col">${label}${h ? `<div class="vc-bar" data-h="${h}" style="height:${h}px;background:${color}${extra}"></div>` : ''}</div>`;
    }).join('');
    const cats = o.cats.map((c, i) => `<p class="${(o.hl || []).includes(i) ? 'strong' : ''}">${c}</p>`).join('');
    const rows = (o.rows || []).map(r => `<div class="vc-cats">${r}</div>`).join('');
    return `<div class="vc" style="--gap:${o.gap ?? 14}px"><div class="vc-track" style="height:${o.track}px">${cols}${o.overlay || ''}</div><div class="vc-cats">${cats}</div>${rows}</div>`;
  }

  function hrows(rows, fmt, barMax, gap, overlay) {
    const top = Math.max(...rows.map(r => r.v));
    return `<div class="hr-rows" style="gap:${gap}px">` + rows.map(r => {
      const w = Math.max(3, Math.round(r.v / top * barMax));
      return `<div class="hr-row${r.arm ? ' arm' : ''}"><div class="hr-name"><p>${r.name} (${r.when})</p><p>${r.note}</p></div>` +
        `<div class="hr-bar" data-w="${w}" style="width:${w}px"></div>` +
        counter(fmt(r.v), 'hr-val', fmt(r.v).startsWith('$') ? 'data-pre="$"' : '') + '</div>';
    }).join('') + (overlay || '') + '</div>';
  }

  // Concentric benches of an open pit, with the haul road spiralling up
  function pit(cx, cy, rot, n, step, opts = {}) {
    const fills = [], rings = [];
    for (let i = n - 1; i >= 0; i--) {
      const rx = 64 + i * step, ry = rx * 0.42;
      const k = i / (n - 1);
      const r = Math.round(10 + k * 12), g = Math.round(29 + k * 22), b = Math.round(56 + k * 38);
      fills.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="rgb(${r},${g},${b})" fill-opacity="${opts.fillOpacity ?? 1}"/>`);
    }

  const FX = {
    fade: (el, p) => { el.style.opacity = p; },
    rise: (el, p, done) => { el.style.opacity = p; el.style.transform = done ? '' : `translateY(${((1 - p) * 30).toFixed(2)}px)`; },
    left: (el, p, done) => { el.style.opacity = p; el.style.transform = done ? '' : `translateX(${((p - 1) * 70).toFixed(2)}px)`; },
    right: (el, p, done) => { el.style.opacity = p; el.style.transform = done ? '' : `translateX(${((1 - p) * 70).toFixed(2)}px)`; },
    pop: (el, p, done) => { el.style.opacity = Math.min(1, Math.max(0, p) * 2.5); el.style.transform = done ? '' : `scale(${(0.3 + 0.7 * p).toFixed(3)})`; },
    stamp: (el, p, done) => { el.style.opacity = Math.min(1, p * 3); el.style.transform = done ? '' : `scale(${(1.35 - 0.35 * p).toFixed(3)})`; },
    h: (el, p) => { el.style.height = (el.dataset.h * p).toFixed(2) + 'px'; },
    w: (el, p) => { el.style.width = (el.dataset.w * p).toFixed(2) + 'px'; },
    sx: (el, p, done) => { el.style.transform = done ? '' : `scaleX(${p.toFixed(4)})`; },
    rule: (el, p) => { el.style.setProperty('--k', p.toFixed(4)); },
    draw: (el, p) => {
      const L = el._len || (el._len = el.getTotalLength());
      el.style.strokeDasharray = `${L} ${L}`;
      el.style.strokeDashoffset = (L * (1 - p)).toFixed(2);
    },
    count: (el, p, done) => { el.style.opacity = p > 0 ? '' : 0; el.textContent = done ? el.dataset.final : fmtCount(el, p); },
  };
  // inline-block so transforms apply to inline counters and words
  const INLINE_FX = new Set(['pop', 'stamp', 'left', 'right', 'rise']);

  // ---------------------------------------------------------------------------
  // Build the deck
  // ---------------------------------------------------------------------------
  const stage = document.getElementById('stage');
  const screen = document.getElementById('screen');
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = `slide ${s.kind}`;
    el.id = 's-' + s.id;
    el.setAttribute('aria-label', `Slide ${i + 1} of ${SLIDES.length}: ${s.title}`);
    el.setAttribute('aria-hidden', 'true');
    el.inert = true;
    el.innerHTML = s.html();
    stage.appendChild(el);
    s.el = el;
    s.entries = s.tl.map(([sel, fx, at, d, st = 0, ez = 'out', deco = false]) => {
      const els = [...el.querySelectorAll(sel)];
      if (INLINE_FX.has(fx)) els.forEach(e => { if (getComputedStyle(e).display === 'inline') e.style.display = 'inline-block'; });
      return { els, fx: FX[fx], at, d, st, ez: EASE[ez], deco, last: new Array(els.length).fill(NaN) };
    });
    s.end = Math.max(0, ...s.entries.map(e => e.at + e.d + e.st * Math.max(0, e.els.length - 1)));
    s.words = (SAY[s.id] || '').split(/\s+/).filter(Boolean).length;
  });
  const blackout = document.createElement('div');
  blackout.className = 'blackout';
  blackout.hidden = true;
  stage.appendChild(blackout);

  function apply(s, t, decoOnly) {
    for (const e of s.entries) {
      const tt = decoOnly && !e.deco ? Infinity : t;
      for (let k = 0; k < e.els.length; k++) {
        const raw = (tt - e.at - k * e.st) / e.d;
        const done = raw >= 1;
        const p = done ? 1 : raw <= 0 ? 0 : e.ez(raw);
        if (e.last[k] === p) continue;
        e.last[k] = p;
        e.fx(e.els[k], p, done);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Navigation, rehearsal and controls
  // ---------------------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const MAIN = SLIDES.filter(s => !s.backup);
  const WPM = 125;
  const durOf = s => Math.max(5, s.words / WPM * 60 + 0.6);
  const TOTAL = MAIN.reduce((a, s) => a + durOf(s), 0);
  const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

  let cur = 0, enterAt = performance.now(), decoOnly = true, rehearsing = false, slideStart = 0, rehearseStart = 0;

  function fit() {
    const r = screen.getBoundingClientRect();
    const k = Math.min(r.width / 1920, r.height / 1080);
    stage.style.transform = `translate(${((r.width - 1920 * k) / 2).toFixed(2)}px, ${((r.height - 1080 * k) / 2).toFixed(2)}px) scale(${k})`;
  }

  function show(i, { animate = true, instant = false } = {}) {
    i = clamp(i, 0, SLIDES.length - 1);
    const prev = SLIDES[cur], s = SLIDES[i];
    if (instant) stage.classList.add('instant');
    if (prev !== s) {
      prev.el.classList.remove('on');
      prev.el.setAttribute('aria-hidden', 'true');
      prev.el.inert = true;
    }
    cur = i;
    decoOnly = false;
    if (animate && !reduce) { apply(s, 0); enterAt = performance.now(); }
    else { apply(s, Infinity); enterAt = performance.now() - (s.end + 1) * 1000; }
    s.el.classList.add('on');
    s.el.removeAttribute('aria-hidden');
    s.el.inert = false;
    if (instant) { void stage.offsetWidth; stage.classList.remove('instant'); }
    slideStart = performance.now();
    ui();
    try { history.replaceState(null, '', '#' + s.id); } catch (e) { /* hash updates are a convenience */ }
  }
  const next = () => { if (cur < SLIDES.length - 1) show(cur + 1); else if (rehearsing) stopRehearsal(); };
  const prev = () => { if (cur > 0) show(cur - 1, { animate: false }); };

  function ui() {
    const s = SLIDES[cur];
    $('count').textContent = `${cur + 1} / ${SLIDES.length}`;
    $('where').textContent = s.section;
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === SLIDES.length - 1;
    $('live').textContent = `Slide ${cur + 1} of ${SLIDES.length}: ${s.title}`;
    const say = SAY[s.id];
    const firstLine = say ? say.split(/(?<=[.:?!])\s/)[0] : '';
    $('cue').textContent = CUE[s.id] || (firstLine ? `Advance on: “${firstLine.length > 90 ? firstLine.slice(0, 88).trim() + '…' : firstLine}”` : '');
    $('say').textContent = say || 'Not in the address. Keep for questions.';
    const nxt = SLIDES[cur + 1];
    $('meta').textContent = (say ? `about ${mmss(durOf(s))} at ${WPM} words a minute` : 'backup') + (nxt ? ` · next: ${nxt.title}` : ' · last slide');
    [...$('menu').querySelectorAll('button[data-i]')].forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === cur)));
  }

  function startRehearsal() {
    rehearsing = true;
    $('rehearse').setAttribute('aria-pressed', 'true');
    $('rehearse').textContent = 'Stop rehearsal';
    setNotes(true);
    $('track').hidden = false;
    if (cur >= MAIN.length - 1 || SLIDES[cur].backup) show(0); else show(cur);
    rehearseStart = performance.now();
  }
  function stopRehearsal() {
    rehearsing = false;
    $('rehearse').setAttribute('aria-pressed', 'false');
    $('rehearse').textContent = `Rehearse ${mmss(TOTAL)}`;
    $('track').hidden = true;
  }
  function setNotes(on) {
    $('notes').hidden = !on;
    $('notesBtn').setAttribute('aria-pressed', String(on));
    requestAnimationFrame(fit);
  }

  function frame(now) {
    const s = SLIDES[cur];
    const t = (now - enterAt) / 1000;
    if (!reduce) {
      if (t <= s.end + 0.05 || decoOnly) apply(s, t, decoOnly);
      if (s.ambient) s.ambient(s.el, t);
    }
    if (rehearsing) {
      const el = (now - slideStart) / 1000, d = durOf(s);
      $('trackFill').style.width = (clamp(el / d, 0, 1) * 100).toFixed(1) + '%';
      $('meta').textContent = `Rehearsal ${mmss((now - rehearseStart) / 1000)} of about ${mmss(TOTAL)} · this slide ${mmss(Math.max(0, d - el))} left`;
      if (el >= d) { if (s.id === 'close' || s.backup) stopRehearsal(); else next(); }
    }
    requestAnimationFrame(frame);
  }

  // menu
  const menu = $('menu');
  let lastSection = '';
  let menuHtml = '';
  SLIDES.forEach((s, i) => {
    if (s.section !== lastSection) { menuHtml += `<h3>${s.section}</h3>`; lastSection = s.section; }
    menuHtml += `<button type="button" data-i="${i}"><b>${i + 1}</b><span>${s.title}</span></button>`;
  });
  menuHtml += '<p class="keys">→ / Space / Page Down: next · ← / Page Up: back · Home / End · F: full screen · N: notes · B: black screen · R: replay the slide · Esc: close</p>';
  menu.innerHTML = menuHtml;
  const openMenu = on => { menu.hidden = !on; $('jump').setAttribute('aria-expanded', String(on)); if (on) (menu.querySelector('[aria-current="true"]') || menu.querySelector('button')).focus(); };
  menu.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { show(+b.dataset.i); openMenu(false); screen.focus(); } });
  $('jump').addEventListener('click', e => { e.stopPropagation(); openMenu(menu.hidden); });
  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && e.target !== $('jump')) openMenu(false); });

  $('prev').addEventListener('click', prev);
  $('next').addEventListener('click', next);
  $('notesBtn').addEventListener('click', () => setNotes($('notes').hidden));
  $('rehearse').addEventListener('click', () => (rehearsing ? stopRehearsal() : startRehearsal()));
  async function toggleFull() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await screen.requestFullscreen();
    } catch (e) { /* full screen is optional; some viewers refuse it */ }
  }
  $('full').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', () => { $('full').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; requestAnimationFrame(fit); });

  screen.addEventListener('click', e => { if (e.button === 0) next(); });
  let touchX = null;
  screen.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  screen.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 40) { e.preventDefault(); dx < 0 ? next() : prev(); }
  });
  let idleTimer = 0;
  screen.addEventListener('mousemove', () => { screen.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => screen.classList.add('idle'), 2500); });

  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    const onButton = tag === 'BUTTON';
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case 'ArrowDown': next(); break;
      case ' ': case 'Enter': if (onButton) return; next(); break;
      case 'ArrowLeft': case 'PageUp': case 'ArrowUp': case 'Backspace': prev(); break;
      case 'Home': show(0); break;
      case 'End': show(MAIN.length - 1); break;
      case 'f': case 'F': toggleFull(); break;
      case 'n': case 'N': setNotes($('notes').hidden); break;
      case 'b': case 'B': case '.': blackout.hidden = !blackout.hidden; break;
      case 'r': case 'R': show(cur); break;
      case 'Escape': if (!menu.hidden) { openMenu(false); screen.focus(); } else return; break;
      default: return;
    }
    e.preventDefault();
  });

  new ResizeObserver(fit).observe(screen);
  window.addEventListener('resize', fit);

  // start on the slide named in the link, else the cover at rest with its pit drawing in
  const start = SLIDES.findIndex(s => '#' + s.id === location.hash);
  stopRehearsal();
  if (start > 0) { show(start, { animate: false, instant: true }); }
  else {
    SLIDES[0].el.classList.add('on');
    SLIDES[0].el.removeAttribute('aria-hidden');
    SLIDES[0].el.inert = false;
    apply(SLIDES[0], reduce ? Infinity : 0, true);
    enterAt = performance.now();
    decoOnly = !reduce;
    ui();
  }
  fit();
  requestAnimationFrame(frame);

  // hook for rendering checks: draw slide i at time t without transitions
  window.__deck = {
    count: SLIDES.length,
    ids: SLIDES.map(s => s.id),
    at(i, t) {
      show(i, { animate: true, instant: true });
      const s = SLIDES[i];
      enterAt = performance.now() - t * 1000;
      apply(s, t);
      if (s.ambient) s.ambient(s.el, t);
    },
  };
})();
</script>
</html>
